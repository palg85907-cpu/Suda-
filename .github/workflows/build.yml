name: Build Suda APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract Suda project
        run: |
          mkdir -p /tmp/suda
          unzip -q Suda_Phone_Build_Ready.zip -d /tmp/suda

      - name: Build APK
        run: |
          PROJECT=$(dirname "$(find /tmp/suda -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
          cd "$PROJECT"
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon

      - name: Upload Suda APK
        uses: actions/upload-artifact@v4
        with:
          name: Suda-debug-apk
          path: /tmp/suda/**/app/build/outputs/apk/debug/*.apk
          
